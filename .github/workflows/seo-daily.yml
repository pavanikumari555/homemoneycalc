# Daily SEO report -> data/reports/YYYY-MM-DD.json -> shows in /admin/ after deploy.
# Runs 8:00 AM India time. Secrets setup: docs/SETUP-AGENT.md
name: SEO daily report

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build site (needed for the technical SEO audit)
        run: npm run build
      - name: Run daily agent
        run: node scripts/agent/daily.mjs
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WEB_ANALYTICS_SITE_ID: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_SITE_ID }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          BING_WEBMASTER_KEY: ${{ secrets.BING_WEBMASTER_KEY }}
          BING_SITE: ${{ vars.BING_SITE }}
          # AI summary: any ONE of these (Gemini and Groq have free tiers)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          SITE_LAUNCH_DATE: ${{ vars.SITE_LAUNCH_DATE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Manual verification runs do not send owner messages.
          ALLOW_OWNER_NOTIFICATIONS: ${{ github.event_name == 'schedule' }}
      - name: Save report (triggers a deploy so /admin/ updates)
        run: |
          git config user.name "homemoneycalc-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports data/research-observations.json data/agent-proposals.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore(report): daily SEO report $(date -u +%F)"
          git pull --rebase origin main
          git push
