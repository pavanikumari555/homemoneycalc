# Daily SEO report -> data/reports/YYYY-MM-DD.json -> shows in /admin/ after deploy.
# Runs 8:00 AM India time. Secrets setup: docs/SETUP-AGENT.md
name: SEO daily report

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build site (needed for the technical SEO audit)
        run: npm run build
      - name: Run daily agent
        run: node scripts/agent/daily.mjs
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          SITE_LAUNCH_DATE: ${{ vars.SITE_LAUNCH_DATE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save report (triggers a deploy so /admin/ updates)
        run: |
          git config user.name "calcivy-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore(report): daily SEO report $(date -u +%F)"
          git push
